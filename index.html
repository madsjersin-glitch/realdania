<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Et liv i Danmark</title>
<meta name="description" content="Seks mennesker. Seks steder i livet. Seks Realdania-projekter og et kampagnebud til hvert. Af Mads Jersin.">
<meta property="og:title" content="Et liv i Danmark">
<meta property="og:description" content="Seks mennesker. Seks steder i livet. Seks Realdania-projekter og et kampagnebud til hvert.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='16' r='9' fill='%23F8C5A0'/%3E%3Cpath d='M20 28h24l-3 34H23z' fill='%23F91E32'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62.5..125,100..900;1,62.5..125,100..900&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF; --card:#FFFFFF; --ink:#000000; --muted:#5F6368; --line:#E6E6E6;
    --accent:#F91E32; --pink:#FDC9CE; --blue:#9FDBF6; --yellow:#F2C46D; --green:#2F7D57;
    --tint:#E3F4FC;
    --serif:"Archivo", "Helvetica Neue", Arial, sans-serif; --sans:"Archivo", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:1180px;margin:0 auto;padding-left:16px;padding-right:16px}
  @media (min-width:700px){.wrap{padding-left:32px;padding-right:32px}}
  .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}

  /* ---------- HERO ---------- */
  .hero{min-height:94vh;display:flex;flex-direction:column;justify-content:center;padding-top:48px;padding-bottom:24px}
  h1{font-family:var(--serif);font-weight:800;font-stretch:125%;font-size:clamp(44px,8.4vw,112px);line-height:.95;letter-spacing:-.025em;margin:18px 0 22px}
  h1 em{font-style:normal;color:var(--accent)}
  .lede{font-size:clamp(17px,2vw,21px);max-width:640px;color:#3a3833;margin:0 0 28px}
  .cta{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:14px 22px;font-weight:500;text-decoration:none;transition:transform .2s,background .2s}
  .cta:hover,.cta:focus-visible{transform:translateY(-2px);background:var(--accent)}
  .lineup{width:100%;height:auto;margin-top:32px;max-height:320px;overflow:visible}

  /* ---------- FIGURES ---------- */
  .leg,.arm{transform-box:fill-box;transform-origin:50% 0%}
  .arms-walk{display:none}
  .walking .arms-walk{display:inline}
  .walking .arms-pose{display:none}
  .walking .legL{animation:stepA .55s ease-in-out infinite alternate}
  .walking .legR{animation:stepB .55s ease-in-out infinite alternate}
  .walking .armL.swing{animation:swingB .55s ease-in-out infinite alternate}
  .walking .armR.swing{animation:swingA .55s ease-in-out infinite alternate}
  .walking .bob{animation:bob .275s ease-in-out infinite alternate}
  .idle .bob{animation:breathe 3.4s ease-in-out infinite}
  .idle .arms-pose .gest{transform-box:fill-box;transform-origin:50% 100%;animation:gest 4s ease-in-out infinite}
  .slow.walking .legL,.slow.walking .legR,.slow.walking .arm{animation-duration:.85s!important}
  @keyframes stepA{from{transform:rotate(14deg)}to{transform:rotate(-14deg)}}
  @keyframes stepB{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
  @keyframes swingA{from{transform:rotate(14deg)}to{transform:rotate(-14deg)}}
  @keyframes swingB{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
  @keyframes gest{0%,80%,100%{transform:rotate(0)}86%{transform:rotate(-10deg)}93%{transform:rotate(5deg)}}

  /* ---------- JOURNEY ---------- */
  .journey-head{padding-top:64px;padding-bottom:24px}
  .section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
  h2{font-family:var(--serif);font-weight:800;font-stretch:125%;font-size:clamp(32px,4.5vw,52px);line-height:1;margin:6px 0 0;letter-spacing:-.01em}
  .hint{color:var(--muted);font-size:14px;margin:0}

  .timeline{position:relative;display:grid;grid-template-columns:repeat(6,1fr);margin:28px 0 0;padding:0;list-style:none}
  .timeline::before,.timeline .fill{content:"";position:absolute;left:calc(100%/12);right:calc(100%/12);top:9px;height:2px;background:var(--line)}
  .timeline .fill{background:var(--ink);right:auto;width:0;transition:width .9s cubic-bezier(.6,0,.3,1)}
  .timeline button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0 2px;color:var(--muted);font-size:13px}
  .timeline .dot{width:20px;height:20px;border-radius:50%;background:var(--paper);border:2px solid #CFCFCF;transition:all .3s}
  .timeline button.done .dot{border-color:var(--ink);background:var(--ink)}
  .timeline button.active{color:var(--ink);font-weight:600}
  .timeline button.active .dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 6px rgba(249,30,50,.16)}
  @media (max-width:560px){.timeline .lbl{font-size:11px}}

  .band{background:var(--tint);transition:background .9s;padding:36px 0 44px;position:relative;overflow:hidden}
  .stagegrid{display:grid;grid-template-columns:310px minmax(0,1fr);gap:20px;align-items:start}
  .stagegrid > div:last-child{padding-top:40px}
  .person{position:relative}
  .pstage{position:relative;height:560px}
  .pblock{position:absolute;inset:0;display:flex;flex-direction:column}
  .pblock > *{transition:transform .9s cubic-bezier(.3,.7,.2,1),opacity .7s ease}
  .pblock.leaving .p-name,.pblock.leaving .p-age,.pblock.leaving .p-line{transition:transform .4s ease-in,opacity .25s ease-in}
  .p-name{font-family:var(--serif);font-weight:800;font-stretch:125%;font-size:34px;line-height:1.05;letter-spacing:-.015em;margin:0}
  .p-age{font-family:var(--serif);font-weight:800;font-stretch:125%;font-size:96px;line-height:.95;letter-spacing:-.03em;color:rgba(249,30,50,.13);margin:4px 0 0;white-space:nowrap}
  .p-age.multi{font-size:32px;line-height:1.1;margin-top:10px;display:flex;gap:.55em;flex-wrap:nowrap}
  .p-age.multi span{display:inline-block;animation:ageIn .8s cubic-bezier(.3,.7,.2,1) both}
  .p-age.multi span:nth-child(1){color:#F57A86;animation-delay:.35s}
  .p-age.multi span:nth-child(2){color:#F91E32;animation-delay:.5s}
  .p-age.multi span:nth-child(3){color:#FBC4CA;animation-delay:.65s}
  @keyframes ageIn{from{opacity:0;transform:translateX(var(--dx,60px))}to{opacity:1;transform:none}}
  .walker{position:relative;flex:1;min-height:0;transition:transform 1.4s cubic-bezier(.35,.1,.3,1),opacity 1.2s!important}
  .walker svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
  .p-line{margin:14px 0 0;color:var(--muted);font-size:15px;line-height:1.45;min-height:4.4em}
  .ground{height:2px;background:rgba(22,22,22,.18);margin:14px 0 0}
  .stage-label{margin-top:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;transition:opacity .4s}

  /* ---------- DECK ---------- */
  .deck{position:relative;padding:0 52px}
  .deck-inner{position:relative;transition:height .45s ease}
  .pcard{position:absolute;top:0;left:0;width:calc(100% - 60px);background:var(--card);border-radius:18px;
    box-shadow:0 30px 60px -30px rgba(22,22,22,.35),0 2px 6px rgba(22,22,22,.06);
    display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:26px;padding:20px;
    transform-origin:100% 50%;transition:transform .7s cubic-bezier(.3,.7,.2,1),opacity .7s;will-change:transform}
  .pcard:not(.front) .pc-media,.pcard:not(.front) .pc-body{opacity:.08;transition:opacity .4s}
  .pcard.front .pc-media,.pcard.front .pc-body{opacity:1;transition:opacity .5s .2s}
  .pc-media{display:flex;flex-direction:column;min-width:0}
  .pc-img{position:relative;border-radius:12px;overflow:hidden;flex:1;min-height:240px;background:#eee}
  @media (max-width:1100px){.pc-img{flex:none;aspect-ratio:4/3;min-height:0}}
  @media (min-width:640px) and (max-width:1100px){.pc-img{aspect-ratio:16/9}.pc-thumbs button{aspect-ratio:16/10!important}}
  .pc-img img,.pc-img svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .credit{position:absolute;right:8px;bottom:6px;font-size:10px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .pc-thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
  .pc-thumbs button{position:relative;padding:0;border:0;border-radius:7px;overflow:hidden;aspect-ratio:1;background:#eee;opacity:.55;transition:opacity .2s,transform .2s}
  .pc-thumbs button:hover{opacity:.9;transform:translateY(-2px)}
  .pc-thumbs button.on{opacity:1;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
  .pc-thumbs img,.pc-thumbs svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

  .pc-body{display:flex;flex-direction:column;gap:14px;min-width:0;padding:4px 4px 2px 0}
  .seg{display:inline-flex;background:#F1F1F1;border-radius:999px;padding:4px;align-self:flex-start;gap:2px}
  .seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--muted);transition:all .25s}
  .seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .seg button{position:relative}
  /* one-time nudge pointing at the first "Mit kampagnebud" toggle */
  .nudge{position:absolute;left:50%;bottom:calc(100% + 16px);transform:translateX(-50%) rotate(-3deg);white-space:nowrap;
    background:var(--accent);color:#fff;font-family:"Gochi Hand","Comic Sans MS","Marker Felt",cursive;font-weight:400;font-size:22px;line-height:1;
    padding:9px 16px 10px;border-radius:14px;box-shadow:0 10px 24px -10px rgba(249,30,50,.6);pointer-events:none;z-index:5;
    animation:nudgeIn .5s 1.6s cubic-bezier(.3,1.4,.5,1) both, nudgeBob 1.8s 2.1s ease-in-out infinite}
  .nudge::after{content:"";position:absolute;left:50%;top:100%;margin-left:-9px;border:9px solid transparent;border-top-color:var(--accent);border-bottom:0}
  .nudge.bye{animation:nudgeOut .25s ease-in forwards}
  @keyframes nudgeIn{from{opacity:0;transform:translateX(-50%) translateY(8px) rotate(-3deg) scale(.9)}to{opacity:1;transform:translateX(-50%) rotate(-3deg)}}
  @keyframes nudgeBob{0%,100%{transform:translateX(-50%) rotate(-3deg) translateY(0)}50%{transform:translateX(-50%) rotate(-3deg) translateY(-5px)}}
  @keyframes nudgeOut{to{opacity:0;transform:translateX(-50%) rotate(-3deg) translateY(-6px)}}
  @media (max-width:700px){ .pcard.has-nudge .seg{margin-top:52px} .nudge{font-size:20px} }
  /* second nudge: on "Læs mere", shown after the first campaign click until "Læs mere" is clicked once */
  .btn[data-act="more"]{position:relative}
  .nudge-more{display:none;left:calc(100% + 16px);bottom:auto;top:50%;transform:translateY(-50%) rotate(-2deg);
    animation:nudgeInR .5s .5s cubic-bezier(.3,1.4,.5,1) both, nudgeBobR 1.8s 1s ease-in-out infinite}
  .nudge-more::after{left:auto;right:100%;top:50%;margin:-9px 0 0;border:9px solid transparent;border-right-color:var(--accent);border-left:0}
  body.more-tip .nudge-more{display:block}
  .pcard:not(.front) .nudge{visibility:hidden}
  .pcard:not(.front){overflow:hidden}
  .nudge-more.bye{animation:nudgeOutR .25s ease-in forwards}
  @keyframes nudgeInR{from{opacity:0;transform:translateY(-50%) translateX(-8px) rotate(-2deg) scale(.9)}to{opacity:1;transform:translateY(-50%) rotate(-2deg)}}
  @keyframes nudgeBobR{0%,100%{transform:translateY(-50%) rotate(-2deg) translateX(0)}50%{transform:translateY(-50%) rotate(-2deg) translateX(5px)}}
  @keyframes nudgeOutR{to{opacity:0;transform:translateY(-50%) rotate(-2deg) translateX(6px)}}
  @media (max-width:700px){ .nudge-more{font-size:18px;padding:8px 12px} }
  .kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
  h3{font-family:var(--serif);font-weight:800;font-stretch:125%;font-size:clamp(20px,2vw,25px);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;letter-spacing:-.01em;line-height:1.1;margin:0}
  .badge{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--blue);color:var(--ink);border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:middle;font-family:var(--sans);font-weight:600}
  .intro{margin:0;color:#3a3833}
  .who{display:flex;align-items:center;gap:12px;padding-top:2px}
  .avatars{display:flex}
  .avatars span{width:40px;height:40px;border-radius:50%;background:var(--tint);border:2px solid #fff;overflow:hidden;margin-left:-10px;flex:none}
  .avatars span:first-child{margin-left:0}
  .avatars svg{width:100%;height:100%;display:block}
  .who b{display:block;font-size:15px}
  .who small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
  .stat{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
  .stat strong{font-family:var(--serif);font-size:32px;font-weight:800;font-stretch:125%;line-height:1;color:var(--accent)}
  .stat span{font-size:14px;color:var(--muted)}
  .progress{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
  .bar{flex:1;height:5px;border-radius:99px;background:#EDEDED;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
  .headline{font-family:var(--serif);font-size:clamp(24px,2.5vw,32px);line-height:1.1;margin:0;font-weight:800;font-stretch:125%;letter-spacing:-.015em}
  .headline::before{content:"“";color:var(--accent)} .headline::after{content:"”";color:var(--accent)}
  .spec{display:grid;grid-template-columns:96px 1fr;gap:10px 14px;margin:0;font-size:15px}
  .spec dt{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-top:4px;font-weight:600}
  .spec dd{margin:0}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
  .btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:9px 16px;font-weight:500;font-size:14px;transition:background .2s,color .2s;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:var(--ink);color:#fff}
  .btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.solid:hover{background:#D0101F;border-color:#D0101F}
  .view[hidden]{display:none}
  .view{display:flex;flex-direction:column;gap:14px;animation:fadeIn .35s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .navc{position:absolute;top:240px;width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(255,255,255,.95);background:rgba(255,255,255,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;font-size:18px;z-index:30;transition:background .2s,opacity .2s}
  .navc:hover{background:rgba(255,255,255,.85)}
  .navc[disabled]{opacity:.3;pointer-events:none}
  .navc.prev{left:0} .navc.next{right:0}

  .drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s ease;margin:0 52px}
  .drawer.open{grid-template-rows:1fr}
  .drawer > div{overflow:hidden}
  .drawer-body{margin-top:18px;background:var(--card);border-radius:18px;padding:24px 26px;width:calc(100% - 60px);box-sizing:border-box;transition:height .6s cubic-bezier(.3,.7,.2,1)}
  .dw{display:grid;grid-template-columns:1fr 1fr;gap:8px 36px}
  .dist{grid-column:1/-1;border-top:1px solid rgba(0,0,0,.1);margin-top:14px;padding-top:18px}
  .dw.swap-out{transition:transform .3s ease-in,opacity .25s ease-in}
  .dw.swap-in{transition:transform .6s cubic-bezier(.3,.7,.2,1),opacity .5s ease}
  .drawer-body section{min-width:0}
  .drawer-body h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:600}
  .drawer-body section > h4:first-child{margin-top:0}
  .drawer-body p{margin:0}
  .drawer-body ol,.drawer-body ul{margin:0;padding-left:20px;display:grid;gap:7px}
  .source{display:inline-block;margin-top:14px;font-size:14px;color:var(--muted)}

  @media (max-width:1100px){
    .stagegrid{grid-template-columns:1fr;gap:0}
    .stagegrid > div:last-child{padding-top:0}
    .person{max-width:460px;margin:0 auto;width:100%}
    .pstage{height:470px}
    .p-name{font-size:28px}
    .p-age{font-size:76px}
    .p-age.multi{font-size:28px}
    .deck{padding:0;margin-top:22px}
    .pcard{width:calc(100% - 24px);grid-template-columns:1fr;gap:16px;padding:14px}
    .navc{display:none}
    .drawer{margin:0}
    .drawer-body{width:calc(100% - 24px);padding:20px}
    .dw{grid-template-columns:1fr}
  }
  .mobile-nav{display:none}
  @media (max-width:1100px){
    .mobile-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
    .mobile-nav .count{color:var(--muted);font-weight:600}
  }

  /* ---------- OUTRO ---------- */
  .outro{padding-top:84px;padding-bottom:56px;text-align:center}
  .outro h2{max-width:780px;margin:18px auto 22px}
  .outro p{max-width:620px;margin:0 auto 14px;color:#3a3833;font-size:18px}
  .outro-rule{border:0;height:2px;background:rgba(22,22,22,.14);max-width:620px;margin:36px auto 0}
  .sign{margin-top:26px;font-size:15px;color:var(--muted)}
  .sign strong{display:block;font-family:var(--serif);font-size:24px;color:var(--ink);font-weight:800;font-stretch:125%}
  .fine{max-width:640px;margin:40px auto 0;font-size:13px;color:var(--muted)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<header class="hero wrap">
  <div class="eyebrow" id="tHeroEyebrow"></div>
  <h1 id="tHeroTitle"></h1>
  <p class="lede" id="tHeroLede"></p>
  <div><a class="cta" href="#rejsen" id="tHeroCta"></a></div>
  <svg class="lineup idle" id="lineup" viewBox="0 0 1100 320" role="img" aria-label="Seks illustrerede personer i forskellige aldre"></svg>
</header>

<main id="rejsen">
  <div class="journey-head wrap">
    <div class="section-head">
      <div>
        <div class="eyebrow" id="tJourneyEyebrow"></div>
        <h2 id="tJourneyTitle"></h2>
      </div>
      <p class="hint" id="tJourneyHint"></p>
    </div>
    <ol class="timeline" id="timeline"><span class="fill" id="fill"></span></ol>
  </div>

  <div class="band" id="band">
    <div class="wrap">
      <div class="stagegrid" id="stage">
        <div class="person" id="person">
          <div class="pstage" id="pstage"></div>
          <div class="ground"></div>
          <div class="stage-label" id="stageLabel"></div>
        </div>
        <div>
          <div class="deck" id="deck">
            <button class="navc prev" id="prev" aria-label="Forrige">←</button>
            <div class="deck-inner" id="deckInner" aria-live="polite"></div>
            <button class="navc next" id="next" aria-label="Næste">→</button>
          </div>
          <div class="drawer" id="drawer"><div><div class="drawer-body" id="drawerBody"></div></div></div>
          <div class="mobile-nav">
            <button class="btn" id="mprev">← Forrige</button>
            <span class="count" id="mcount"></span>
            <button class="btn solid" id="mnext">Næste →</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="outro wrap" id="outro">
  <div class="eyebrow" id="tOutroEyebrow"></div>
  <h2 id="tOutroTitle"></h2>
  <p id="tOutroP1"></p>
  <p id="tOutroP2"></p>
  <hr class="outro-rule">
  <div class="sign">
    <strong id="tOutroName"></strong>
    <span id="tOutroRole"></span><br>
    <a id="tOutroEmail" href="#"></a>
  </div>
  <p class="fine" id="tOutroFine"></p>
</footer>

<script src="content.js"></script>
<script>
/* =========================================================
   PALETTE
   ========================================================= */
const K="#111111", W="#FFFFFF", O="#F91E32", PK="#FDC9CE", BL="#9FDBF6", Y="#F2C46D", G="#5BAF7E", DG="#2F7D57";

/* =========================================================
   FIGURES — flat, elongated people. Feet at y=298, centre x=100
   ========================================================= */
const POSES = {
  down:   {pts:[[80,56],[75,98],[73,136]], hand:[73,143]},
  gesture:{pts:[[80,56],[64,98],[48,74]],  hand:[45,66], open:true},
  hip:    {pts:[[80,56],[62,92],[80,120]], hand:[84,121]},
  hold:   {pts:[[80,56],[76,98],[92,110]], hand:[97,110]},
  cane:   {pts:[[80,56],[72,98],[66,136]], hand:[66,143]},
};
function arm(o,pose,side,cls){
  const P=POSES[pose], m=side>0?(x=>200-x):(x=>x);
  const pts=P.pts.map(([x,y])=>`${m(x)} ${y}`).join(" L ");
  const [hx,hy]=P.hand, sleeve=o.sleeve||o.top;
  let extra="";
  if(pose==="cane") extra=`<path d="M${m(hx)} ${hy-4} Q${m(hx)+side*0} ${hy-12} ${m(hx)+side*8} ${hy-8} L${m(hx)+side*12} 298" fill="none" stroke="${K}" stroke-width="3.5" stroke-linecap="round"/>`;
  if(pose==="hold"&&o.prop==="cup") extra=`<rect x="${m(hx)-5}" y="${hy-14}" width="11" height="13" rx="2" fill="${W}" stroke="${K}" stroke-width="1.2"/>`;
  const hand=P.open
    ? (()=>{ // drawn as a right hand, then mirrored for the left so both sides get the same five-finger shape
        const g=`<g class="gest"><path d="M${200-hx} ${hy} l-5 -9 l3 -1 l4 7 l1 -9 l3 0 l0 9 l3 -8 l3 1 l-3 10 l5 -4 l2 2 l-8 9 Z" fill="${o.skin}"/><path d="M${204-hx} ${hy+3} L${200-P.pts[2][0]} ${P.pts[2][1]}" stroke="${o.skin}" stroke-width="7" stroke-linecap="round"/></g>`;
        return side>0 ? g : `<g transform="translate(200 0) scale(-1 1)">${g}</g>`;
      })()
    : `<ellipse cx="${m(hx)}" cy="${hy}" rx="5.5" ry="7" fill="${o.skin}"/>`;
  return `<g class="arm ${cls}${pose==="down"?" swing":""}"><path d="M ${pts}" fill="none" stroke="${sleeve}" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"/>${o.cuff?`<circle cx="${m(P.pts[2][0])}" cy="${P.pts[2][1]}" r="6.3" fill="${o.cuff}"/>`:""}${hand}${extra}</g>`;
}
function shoe(x,dir,o){
  const heel=x-dir*11, toe=x+dir*19;
  const out=o.shoe===W?`stroke="${K}" stroke-width="1.4"`:"";
  return `<path d="M${heel} 298 L${heel} 286 Q${heel} 279 ${heel+dir*7} 279 L${x+dir*5} 279 Q${toe} 282 ${toe} 291 L${toe} 298 Z" fill="${o.shoe}" ${out}/>
    <path d="M${heel} 295 H${toe}" stroke="${o.shoe===W?K:W}" stroke-width="${o.shoe===W?1.4:2}"/>
    <path d="M${x-dir*2} 283 l${dir*4} 5 M${x+dir*3} 282 l${dir*4} 5" stroke="${o.shoe===W?K:W}" stroke-width="1.3"/>`;
}
function legs(o){
  const out=o.bottom===W?`stroke="${K}" stroke-width="1.5" stroke-linejoin="round"`:"";
  const L=[], R=[];
  let ac;
  if(o.leg==="wide"){
    ac=[86,114];
    L.push(`<path d="M86 126 L100 126 L101 272 L71 272 Z" fill="${o.bottom}" ${out}/><path d="M93 150 L90 266" stroke="${K}" stroke-width="1" opacity=".5"/>`);
    R.push(`<path d="M100 126 L114 126 L129 272 L99 272 Z" fill="${o.bottom}" ${out}/><path d="M108 150 L113 266" stroke="${K}" stroke-width="1" opacity=".5"/>`);
  } else if(o.leg==="slim"){
    ac=[93,107];
    L.push(`<rect x="87" y="126" width="13" height="150" rx="3" fill="${o.bottom}" ${out}/>`);
    R.push(`<rect x="100" y="126" width="13" height="150" rx="3" fill="${o.bottom}" ${out}/>`);
  } else {
    ac=[93,107];
    L.push(`<rect x="88.5" y="140" width="9" height="136" rx="4" fill="${o.skin}"/>`);
    R.push(`<rect x="102.5" y="140" width="9" height="136" rx="4" fill="${o.skin}"/>`);
  }
  const sock=x=>o.sock?`<rect x="${x-6}" y="268" width="12" height="14" fill="${o.sock}"/>`:"";
  return `<g class="leg legL">${sock(ac[0])}${L.join("")}${shoe(ac[0],-1,o)}</g><g class="leg legR">${sock(ac[1])}${R.join("")}${shoe(ac[1],1,o)}</g>`;
}
function torso(o){
  const t=o.topStyle||"tee";
  if(t==="dress") return `<path d="M80 49 Q100 44 120 49 Q125 51 125 60 L134 196 L66 196 L75 60 Q75 51 80 49Z" fill="${o.top}"/><path d="M92 48 L100 58 L108 48" fill="${o.skin}"/>`;
  if(t==="coat") return `<path d="M80 49 Q100 44 120 49 Q126 51 126 62 L128 180 L72 180 L74 62 Q74 51 80 49Z" fill="${o.top}"/><path d="M100 60 V178" stroke="${K}" stroke-width="1" opacity=".55"/><circle cx="104" cy="96" r="1.6" fill="${K}"/><circle cx="104" cy="122" r="1.6" fill="${K}"/><circle cx="104" cy="148" r="1.6" fill="${K}"/>`;
  let s=`<path d="M80 49 Q100 44 120 49 Q126 51 126 62 L122 132 L78 132 L74 62 Q74 51 80 49Z" fill="${o.top}"/>`;
  if(t==="hoodie") s=`<path d="M84 52 Q100 34 116 52 Q100 60 84 52Z" fill="${o.hood||o.top}"/>`+s+`<path d="M95 56 L94 74 M105 56 L106 74" stroke="${W}" stroke-width="1.6" stroke-linecap="round"/><path d="M84 104 H116 L114 122 H86Z" fill="${o.hood||o.top}" opacity=".6"/>`;
  if(t==="shirt") s+=`<path d="M91 48 L100 60 L109 48" fill="none" stroke="${K}" stroke-width="1.3" stroke-linejoin="round"/><path d="M100 60 V130" stroke="${K}" stroke-width=".9"/><path d="M84 70 Q88 86 84 100" fill="none" stroke="${K}" stroke-width=".9" opacity=".6"/>`;
  if(t==="vest") s+=`<path d="M80 50 L120 50 L116 92 L84 92Z" fill="${o.vest}"/>`;
  return s;
}
function hair(o,part){
  const h=o.hair, st=o.hairStyle;
  if(part==="back"){
    if(st==="long") return `<path d="M88 22 Q88 12 100 12 Q112 12 112 22 L114 74 Q100 78 86 74Z" fill="${h}"/>`;
    if(st==="pony") return `<ellipse cx="113" cy="28" rx="5" ry="10" transform="rotate(-20 113 28)" fill="${h}"/>`;
    if(st==="bun") return `<circle cx="100" cy="12" r="6.5" fill="${h}"/>`;
    return "";

  if(st==="beanie") return `<path d="M87.5 25 Q88 10 100 10 Q112 10 112.5 25Z" fill="${o.beanie}"/><rect x="86.5" y="21" width="27" height="6" rx="3" fill="${o.beanie}"/><path d="M90 22 H110" stroke="${K}" stroke-width=".8" opacity=".4"/>`;
  if(st==="quiff") return `<path d="M88.5 27 Q86 11 98 8 Q111 6 113 18 Q113 24 111.5 27 Q106 18 97 19.5 Q92 21 88.5 27Z" fill="${h}"/>`;
  if(st==="bob") return `<path d="M87 38 Q85 12 100 12 Q115 12 113 38 L109 38 Q109 22 100 20 Q93 21 91 38Z" fill="${h}"/>`;
  if(st==="long") return `<path d="M88.5 30 Q88 13 100 13 Q112 13 111.5 30 Q106 17 94 22 Q91 25 88.5 30Z" fill="${h}"/>`;
  return `<path d="M88.5 27 Q88 13 100 13 Q112 13 111.5 27 Q106 19 100 19.5 Q93 20 88.5 27Z" fill="${h}"/>`;
}
function head(o){
  return `<rect x="95.5" y="34" width="9" height="18" fill="${o.skin}"/>

}
function fig(o){
  const s=o.s||1, hs=o.hs||1, cx=o.cx;
  const tx=cx-100*s, ty=298-298*s;
  const back=[], front=[];
  if(o.prop==="backpack") back.push(`<rect x="63" y="58" width="22" height="54" rx="9" fill="${o.pack}"/>`);
  if(o.prop==="surf") back.push(`<ellipse cx="147" cy="186" rx="15" ry="102" fill="${o.board}"/><path d="M147 86 V286" stroke="${W}" stroke-width="3"/>`);
  if(o.prop==="skate") front.push(`<g transform="rotate(8 133 156)"><rect x="126" y="110" width="14" height="88" rx="7" fill="${o.board}"/><circle cx="124" cy="124" r="3.5" fill="${K}"/><circle cx="124" cy="184" r="3.5" fill="${K}"/></g>`);
  if(o.scarf) front.push(`<path d="M86 46 Q100 56 114 46 L114 55 Q100 65 86 55Z" fill="${o.scarf}"/><rect x="103" y="55" width="9" height="34" rx="2" fill="${o.scarf}"/>`);

  const walkL=o.walkL||"down", walkR=o.walkR||"down";
  return `<g transform="translate(${tx} ${ty}) scale(${s})"><g class="bob">
    ${back.join("")}
    ${legs(o)}
    ${torso(o)}
    ${front.join("")}
    <g class="arms-walk">${arm(o,walkL,-1,"armL")}${arm(o,walkR,1,"armR")}</g>
    <g class="arms-pose">${arm(o,o.poseL||"down",-1,"armL")}${arm(o,o.poseR||"down",1,"armR")}</g>
    <g transform="translate(100 50) scale(${hs}) translate(-100 -50)">${head(o)}</g>
  </g></g>`;
}

  const t=(id,v)=>{ const el=document.getElementById(id); if(el) el.innerHTML=v; };
  const h=CONTENT.hero, j=CONTENT.journey, o=CONTENT.outro;
  t("tHeroEyebrow",h.eyebrow); t("tHeroTitle",`${h.title} <em>${h.titleAccent}</em>`); t("tHeroLede",h.lede);
  t("tHeroCta",`${h.cta} <span aria-hidden="true">→</span>`);
  t("tJourneyEyebrow",j.eyebrow); t("tJourneyTitle",j.title); t("tJourneyHint",j.hint);
  t("tOutroEyebrow",o.eyebrow); t("tOutroTitle",o.title); t("tOutroP1",o.p1); t("tOutroP2",o.p2||""); document.getElementById("tOutroP2").hidden=!o.p2; document.getElementById("tOutroP1").hidden=!o.p1;
  t("tOutroName",o.name); t("tOutroRole",o.role); t("tOutroFine",o.fine||""); document.getElementById("tOutroFine").hidden=!o.fine;
  const m=document.getElementById("tOutroEmail"); if(m){ m.textContent=o.email; m.href="mailto:"+o.email; m.hidden=!o.email; }
  document.title=`${h.title} ${h.titleAccent}`;
})();

/* =========================================================
   RENDER
   ========================================================= */
const $=id=>document.getElementById(id);
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const N=STAGES.length;
let cur=-1, busy=false;
const modes=STAGES.map(()=> "project");
const pref={mode:"project",more:false}; // the view the reader last chose follows them to the next card

const lineupSVG = `<line x1="0" y1="298" x2="1100" y2="298" stroke="${K}" stroke-opacity=".25" stroke-width="2"/>`+
  at("asta",80)+at("malik",225)+at("freja",385)+at("sara",560)+at("lukas",624)+at("jonas",690)+at("henrik",860)+at("inger",1020);
$("lineup").innerHTML=lineupSVG;

const tl=$("timeline");
STAGES.forEach((s,i)=>{
  const li=document.createElement("li");
  li.innerHTML=`<button type="button" aria-label="${s.label}: ${s.project}"><span class="dot"></span><span class="lbl">${s.label}</span></button>`;
  li.querySelector("button").addEventListener("click",()=>go(i));
  tl.appendChild(li);
});

const media=(s,cls)=> s.photo
  ? `<img src="${s.photo}" alt="${s.project}" loading="lazy">`
  : `<svg viewBox="0 0 400 320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration: ${s.project}">${SCENES[s.scene]}</svg>`;

function cardHTML(s,i){
  const project=`<div class="view pc-project" ${modes[i]==="project"?"":"hidden"}>
      <div class="kicker">${s.program} · ${s.place}</div>
      <h3>${s.project}${s.soon?'<span class="badge">På vej</span>':''}</h3>
      <p class="intro">${s.intro}</p>
      <div class="stat"><strong>${s.stat[0]}</strong><span>${s.stat[1]}</span></div>
    </div>`;
  const campaign=`<div class="view pc-campaign" ${modes[i]==="campaign"?"":"hidden"}>
      <div class="kicker">Mit kampagnebud · ${s.project}</div>
      <p class="headline">${s.c.headline}</p>
      <dl class="spec">
        <dt>Målgruppe</dt><dd>${s.c.audience}</dd>
        <dt>Kanaler</dt><dd>${s.c.channel}</dd>
        <dt>Idéen</dt><dd>${s.c.idea}</dd>
      </dl>
      <div class="actions">
        <button class="btn" data-act="more" aria-expanded="false"><span class="lbl-more">Læs mere ↓</span><span class="nudge nudge-more" aria-hidden="true">Klik for at læse mere</span></button>      </div>
    </div>`;
  return `<div class="pc-media">
      <div class="pc-img">${media(s)}${s.photo&&s.credit?`<span class="credit">${s.credit}</span>`:""}</div>
      <div class="pc-thumbs">${STAGES.map((t,j)=>`<button type="button" data-go="${j}" class="${j===i?"on":""}" aria-label="${t.project}">${media(t)}</button>`).join("")}</div>
    </div>
    <div class="pc-body">
      <div class="seg" role="tablist">
        <button role="tab" data-mode="project" aria-selected="${modes[i]==="project"}">Projektet</button>
        <button role="tab" data-mode="campaign" aria-selected="${modes[i]==="campaign"}">Mit kampagnebud${nudgeOn?'<span class="nudge" aria-hidden="true">Klik her for at se mit bud</span>':''}</button>
      </div>
      ${project}${campaign}
    </div>`;
}

let nudgeOn=true; // "Klik her for at se mit bud" sits on every card until the first click on "Mit kampagnebud"
const deck=$("deckInner");
const cards=STAGES.map((s,i)=>{
  const el=document.createElement("article");
  el.className="pcard"+(nudgeOn?" has-nudge":""); el.dataset.i=i;
  el.innerHTML=cardHTML(s,i);
  deck.appendChild(el);
  return el;
});

function drawerHTML(s){
  const m=s.more;
  return `<section><h4>Konceptet</h4><p>${m.concept}</p>
    <h4>Hvorfor det virker</h4><p>${m.why}</p></section>
  <section><h4>Sådan kunne det se ud</h4><ol>${m.steps.filter(([t,d])=>t||d).map(([t,d])=>`<li><strong>${String(t).replace(/[.:]\s*$/,"")}${/^\s*,/.test(d)?"":"."}</strong>${/^\s*,/.test(d)?String(d).trim():" "+d}</li>`).join("")}</ol>
  <a class="source" href="${m.src[1]}" target="_blank" rel="noopener">Kilde om projektet: ${m.src[0]} ↗</a></section>
  ${m.dist&&typeof m.dist==="string"?`<section class="dist"><h4>Distribution</h4><p>${m.dist}</p></section>`:""}`;
}
let swapTok=0;
function swapDrawer(html,dir,animate){
  const body=$("drawerBody"), tok=++swapTok;
  if(!animate){ body.style.height=""; body.style.overflow=""; body.innerHTML=`<div class="dw">${html}</div>`; return; }
  const old=body.querySelector(".dw");
  const h0=body.offsetHeight; body.style.height=h0+"px"; body.style.overflow="hidden";
  old.className="dw swap-out"; old.style.transform=`translateX(${-dir*60}px)`; old.style.opacity=0;
  setTimeout(()=>{
    if(tok!==swapTok) return;
    const nw=document.createElement("div"); nw.className="dw"; nw.innerHTML=html;
    nw.style.transform=`translateX(${dir*60}px)`; nw.style.opacity=0;
    old.replaceWith(nw);
    body.style.transition="none"; body.style.height="auto"; const h1=body.offsetHeight;
    body.style.height=h0+"px"; body.offsetHeight; body.style.transition="";
    body.style.height=h1+"px";
    nw.offsetWidth; nw.className="dw swap-in"; nw.style.transform="none"; nw.style.opacity=1;
    setTimeout(()=>{ if(tok!==swapTok) return; body.style.height=""; body.style.overflow=""; },650);
  },280);
}
function setDrawer(open){
  $("drawer").classList.toggle("open",open);
  const b=cards[cur]&&cards[cur].querySelector('[data-act="more"]');
  if(b){b.setAttribute("aria-expanded",open);b.querySelector(".lbl-more").textContent=open?"Luk ↑":"Læs mere ↓";}
}

const isMobile=()=>window.matchMedia("(max-width:1100px)").matches;
function layoutDeck(){
  const step=isMobile()?9:20;
  cards.forEach((el,i)=>{
    const d=i-cur;
    const wasFront=el.classList.contains("front");
    el.classList.toggle("front",d===0);
    const nd=el.querySelector(".nudge:not(.bye):not(.nudge-more)");
    if(nd && d===0 && !wasFront && cur>0){ nd.style.animation="none"; nd.offsetWidth; nd.style.animation=""; nd.style.animationDelay=".8s, 1.3s"; }
    el.toggleAttribute("inert",d!==0);
    el.setAttribute("aria-hidden",d!==0);
    let t,op,z=20-Math.abs(d);
    if(d<0){ t=`translateX(-115%) rotate(-7deg)`; op=0; }
    else if(d===0){ t="none"; op=1; }
    else { const k=Math.min(d,3); t=`translateX(${k*step}px) scale(${1-k*.055})`; op=d>3?0:1-k*.2; }
    el.style.transform=t; el.style.opacity=op; el.style.zIndex=z;
  });
  sizeDeck();
}
function sizeDeck(){
  const f=cards[cur]; if(!f) return;
  f.style.height="auto";
  const h=f.offsetHeight;
  cards.forEach((el,i)=>{ if(i!==cur) el.style.height=h+"px"; });
  deck.style.height=h+"px";
}
window.addEventListener("resize",()=>{ if(cur>=0) layoutDeck(); });

deck.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){ go(+g.dataset.go); return; }
  const md=e.target.closest("[data-mode]");
  if(md){
    if(md.dataset.mode==="campaign" && nudgeOn){
      nudgeOn=false;
      document.body.classList.add("more-tip");
      document.querySelectorAll(".nudge:not(.nudge-more)").forEach(n=>n.classList.add("bye"));
      setTimeout(()=>{ document.querySelectorAll(".nudge:not(.nudge-more)").forEach(n=>n.remove()); cards.forEach(c=>c.classList.remove("has-nudge")); sizeDeck(); },300);
    }
    pref.mode=md.dataset.mode; if(pref.mode==="project") pref.more=false;
    applyMode(cur);
    if(modes[cur]==="project") setDrawer(false);
    sizeDeck(); return;
  }
  const a=e.target.closest("[data-act]"); if(!a) return;
  if(a.dataset.act==="more"){
    if(document.body.classList.contains("more-tip")){
      document.querySelectorAll(".nudge-more").forEach(n=>n.classList.add("bye"));
      setTimeout(()=>{ document.body.classList.remove("more-tip"); document.querySelectorAll(".nudge-more").forEach(n=>n.remove()); },300);
    }
    const open=!$("drawer").classList.contains("open"); setDrawer(open); pref.more=open;
    if(open) setTimeout(()=>$("drawer").scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"}),300);
  }
  if(a.dataset.act==="dl") downloadCard(cur,a);
});

function applyMode(i){
  modes[i]=pref.mode;
  const el=cards[i];
  el.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-selected",b.dataset.mode===modes[i]));
  el.querySelector(".pc-project").hidden=modes[i]!=="project";
  el.querySelector(".pc-campaign").hidden=modes[i]!=="campaign";
}
function go(n){
  if(n<0||n>=N||n===cur||busy) return;
  const dir=n>cur?1:-1, first=cur===-1;
  cur=n; const s=STAGES[n];
  busy=!first&&!reduce; setTimeout(()=>busy=false,650);

  [...tl.querySelectorAll("button")].forEach((b,i)=>{
    b.classList.toggle("active",i===n); b.classList.toggle("done",i<n);
    b.setAttribute("aria-current",i===n?"step":"false");
  });
  $("fill").style.width=`calc((100% - 100%/6) * ${n/(N-1)})`;
  $("band").style.setProperty("--tint",s.tint);
  document.documentElement.style.setProperty("--tint",s.tint);
  const lbl=$("stageLabel");
  if(first||reduce) lbl.textContent=s.label;
  else { lbl.style.opacity=0; setTimeout(()=>{ lbl.textContent=s.label; lbl.style.opacity=1; },450); }

  // person block: name → age → character → short description, animated in from the right
  const stageEl=$("pstage");
  const old=stageEl.querySelector(".pblock:not(.leaving)");
  if(old){
    old.classList.add("leaving");
    old.querySelectorAll(".p-name,.p-age,.p-line").forEach(el=>{ el.style.transitionDelay="0s"; el.style.transform=`translateX(${-dir*70}px)`; el.style.opacity=0; });
    const ow=old.querySelector(".walker"); ow.classList.add("walking"); ow.classList.remove("idle");
    ow.style.transform=`translateX(${-dir*130}%)`; ow.style.opacity=0;
    setTimeout(()=>old.remove(),reduce?0:1400);
  }
  const blk=document.createElement("div");
  blk.className="pblock";
  blk.innerHTML=`<p class="p-name">${s.name}</p>
    ${(()=>{ const ages=String(s.age).split(",").map(a=>a.trim()).filter(Boolean).map(a=>/^\d+$/.test(a)?a+" år":a);
       const tones=["#FBC4CA","#F57A86","#F91E32"], nums=ages.map(a=>parseInt(a)||0), order=[...nums].sort((x,y)=>x-y);
       return ages.length>1 ? `<p class="p-age multi" style="--dx:${dir*60}px">${ages.map((a,k)=>`<span style="color:${tones[Math.round(order.indexOf(nums[k])*(tones.length-1)/Math.max(1,ages.length-1))]}">${a}</span>`).join("")}</p>` : `<p class="p-age">${ages[0]||""}</p>`; })()}
    <div class="walker walking${s.slow?" slow":""}"><svg viewBox="65 0 270 320" preserveAspectRatio="xMidYMax meet" aria-hidden="true">${s.people()}</svg></div>
    <p class="p-line">${s.line}</p>`;
  stageEl.appendChild(blk);
  const w=blk.querySelector(".walker");
  const texts=[[".p-name",.15],[".p-age",.3],[".p-line",1.0]].map(([q,d])=>[blk.querySelector(q),d]);
  if(reduce){ w.classList.remove("walking"); w.classList.add("idle"); }
  else{
    texts.forEach(([el,d])=>{ el.style.transform=`translateX(${dir*70}px)`; el.style.opacity=0; el.style.transitionDelay=d+"s"; });
    w.style.transform=`translateX(${dir*130}%)`;
    blk.getBoundingClientRect();
    requestAnimationFrame(()=>{
      texts.forEach(([el])=>{ el.style.transform="none"; el.style.opacity=1; });
      w.style.transform="none";
    });
    setTimeout(()=>{ w.classList.remove("walking"); w.classList.add("idle"); },1400);
  }

  applyMode(n);
  const keepOpen=pref.mode==="campaign"&&pref.more;
  swapDrawer(drawerHTML(s),dir,!first&&!reduce&&keepOpen&&$("drawer").classList.contains("open"));
  setDrawer(keepOpen);
  layoutDeck();

  $("prev").disabled=n===0; $("mprev").disabled=n===0;
  $("next").disabled=false;
  $("mcount").textContent=`${n+1} / ${N}`;
  $("mnext").textContent=n===N-1?"Afslutning ↓":"Næste →";
  $("next").setAttribute("aria-label",n===N-1?"Afslutning":"Næste");
}
const nextOrOutro=()=>{ if(cur===N-1) $("outro").scrollIntoView({behavior:reduce?"auto":"smooth"}); else go(cur+1); };
$("prev").addEventListener("click",()=>go(cur-1));
$("mprev").addEventListener("click",()=>go(cur-1));
$("next").addEventListener("click",nextOrOutro);
$("mnext").addEventListener("click",nextOrOutro);
document.addEventListener("keydown",e=>{
  const r=$("band").getBoundingClientRect();
  if(r.bottom<0||r.top>innerHeight) return;
  if(e.key==="ArrowRight") go(cur+1);
  if(e.key==="ArrowLeft") go(cur-1);
});
let tx0=null,ty0=null;
$("stage").addEventListener("touchstart",e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY},{passive:true});
$("stage").addEventListener("touchend",e=>{
  if(tx0===null) return;
  const dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)) go(cur+(dx<0?1:-1));
  tx0=null;
});
if(QS.has("stage")){
  const n=Math.max(0,Math.min(N-1,+QS.get("stage")||0)); go(n); requestAnimationFrame(()=>$("deck").scrollIntoView({block:"start"}));
  const m=QS.get("mode");
  if(m){ cards[n].querySelector('[data-mode="campaign"]').click(); if(m==="more") setTimeout(()=>cards[n].querySelector('[data-act="more"]').click(),50); }
}
const io=new IntersectionObserver(es=>{ if(es.some(x=>x.isIntersecting)){ io.disconnect(); if(cur===-1) go(0); } },{threshold:.25});
io.observe($("band"));
// render the deck immediately (without walking) so the page is never empty
setTimeout(()=>{ if(cur===-1 && $("band").getBoundingClientRect().top<innerHeight) go(0); },60);

/* =========================================================
   DOWNLOAD — draws the campaign card as a 1080px-wide PNG
   ========================================================= */
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
function wrap(ctx,text,maxW){
  const words=text.split(" "), lines=[]; let line="";
  for(const w of words){ const t=line?line+" "+w:w; if(ctx.measureText(t).width>maxW&&line){ lines.push(line); line=w; } else line=t; }
  if(line) lines.push(line); return lines;
}
async function downloadCard(i,btn){
  const s=STAGES[i]; const W1=1080, pad=84, imgH=640;
  const label=btn.textContent; btn.textContent="Laver billede …"; btn.disabled=true;
  try{
    try{ await Promise.all([document.fonts.load('800 expanded 58px Archivo'),document.fonts.load('400 30px Archivo'),document.fonts.load('600 20px Archivo')]); }catch(e){}
    const img = s.photo ? await loadImg(s.photo)
      : await loadImg("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="1080" height="864" preserveAspectRatio="xMidYMid slice">${SCENES[s.scene]}</svg>`));
    const c=document.createElement("canvas"), ctx=c.getContext("2d");
    const serif='"Archivo", Arial, sans-serif', sans='"Archivo", Arial, sans-serif';
    const tw=W1-pad*2;
    const run=(draw)=>{
      let y=imgH+pad;
      if(draw){
        ctx.fillStyle="#FFFFFF"; ctx.fillRect(0,0,c.width,c.height);
        const r=Math.max(W1/img.width, imgH/img.height), dw=img.width*r, dh=img.height*r;
        ctx.drawImage(img,(W1-dw)/2,(imgH-dh)/2,dw,dh);
        ctx.fillStyle=s.tint; ctx.fillRect(0,imgH,W1,10);
      }
      ctx.font=`600 20px ${sans}`; ctx.fillStyle="#5F6368";
      if(draw) ctx.fillText(("Mit kampagnebud · "+s.project).toUpperCase(),pad,y);
      y+=58;
      ctx.font=`800 58px ${serif}`; if('fontStretch' in ctx) ctx.fontStretch='expanded';
      const hl=wrap(ctx,"“"+s.c.headline+"”",tw);
      hl.forEach(l=>{ if(draw){ ctx.fillStyle="#000000"; ctx.fillText(l,pad,y); } y+=74; });
      y+=26;
      [["MÅLGRUPPE",s.c.audience],["KANALER",s.c.channel],["IDÉEN",s.c.idea]].forEach(([k,v])=>{
        if('fontStretch' in ctx) ctx.fontStretch='normal'; ctx.font=`600 19px ${sans}`; if(draw){ ctx.fillStyle="#F91E32"; ctx.fillText(k,pad,y); } y+=40;
        ctx.font=`400 30px ${sans}`;
        wrap(ctx,v,tw).forEach(l=>{ if(draw){ ctx.fillStyle="#000000"; ctx.fillText(l,pad,y); } y+=42; });
        y+=22;
      });
      y+=30;
      if(draw){
        ctx.fillStyle="#E6E6E6"; ctx.fillRect(pad,y-34,tw,2);
        ctx.font=`600 22px ${sans}`; ctx.fillStyle="#000000"; ctx.fillText("Et liv i Danmark",pad,y+6);
        ctx.font=`400 22px ${sans}`; ctx.fillStyle="#5F6368";
        const r="Mads Jersin · Realdania, Brand og Kampagne"; ctx.fillText(r,W1-pad-ctx.measureText(r).width,y+6);
      }
      return y+pad;
    };
    c.width=W1; c.height=1350;
    const H=Math.max(1350,run(false));
    c.width=W1; c.height=H; run(true);
    const blob=await new Promise(r=>c.toBlob(r,"image/png"));
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`kampagnekort-${i+1}-${s.project.toLowerCase().replace(/[^a-zæøå0-9]+/g,"-").replace(/-+$/,"")}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(err){
    console.error(err); alert("Billedet kunne ikke laves her. Prøv igen fra den publicerede side.");
  }finally{ btn.textContent=label; btn.disabled=false; }
}
</script>
